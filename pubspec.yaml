name: kh_support_tech
description: Application mobile de KH SERVICES
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  device_preview: ^1.1.0
  connectivity_plus: ^5.0.2
  sqflite: ^2.3.0
  path: ^1.8.3
  http: ^1.1.0
  shared_preferences: ^2.2.2
  kkiapay: ^1.0.6
  file_picker: ^8.0.0
  url_launcher: ^6.2.5 
  webview_flutter: ^4.4.2 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# ✅ CONFIGURATION DES ICÔNES
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_foreground: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/banner_laptop.png
    - assets/logo.png
    # ✅ 4 PHOTOS D'ÉQUIPE AJOUTÉES ICI (format .jpeg)
    - assets/images/equipe1.jpeg
    - assets/images/equipe2.jpeg
    - assets/images/equipe3.jpeg
    - assets/images/equipe4.jpeg